# BLE + USB HID
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# Device info visible to OS
CONFIG_BT_DEVICE_NAME="macro_keyboard"
CONFIG_ZMK_KEYBOARD_NAME="macro_keyboard"

# ZMK Studio (unlock required to edit)
CONFIG_ZMK_STUDIO=y

# Sleep / low-power
CONFIG_ZMK_SLEEP=y

# Display infra: LVGL + SSD1306 driver, currently using ZMK's built-in
# status screen (battery + layer-name widget). The custom screen (4 profile
# slots with active inverted) is implemented in module/src/status_screen.c
# but selecting CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y silently hangs the
# board even with a minimal screen body — root cause TBD. Switch the choice
# below when that's solved; the module/src/status_screen.c file is gated on
# the CUSTOM symbol so it only compiles when we flip back.
CONFIG_ZMK_DISPLAY=y

# Battery reporting (uses zmk,battery -> vbatt voltage divider on AIN2/P0.04)
CONFIG_ZMK_BATTERY_REPORTING=y

# Profile button is wired P1.02 -> diode -> GND. Pressed line settles at
# ~0.7V (one diode drop), which is marginal for nRF52 GPIO interrupts —
# poll the direct kscan instead so we sample reliably regardless.
CONFIG_ZMK_KSCAN_DIRECT_POLLING=y
