# BLE + USB HID
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# Device info visible to OS
CONFIG_BT_DEVICE_NAME="macro_keyboard"
CONFIG_ZMK_KEYBOARD_NAME="macro_keyboard"

# ZMK Studio (unlock required to edit)
CONFIG_ZMK_STUDIO=y

# Sleep / low-power
CONFIG_ZMK_SLEEP=y

# Robustness / fault handling (resilience net kept from the M6 USB-crash hunt).
# The nRF52840 has an MPU (CONFIG_ARM_MPU=y) but HW_STACK_PROTECTION defaulted
# off; turn it on so a stack overflow faults cleanly via the MPU guard instead of
# silently corrupting RAM. Zephyr's default fatal handler then spins forever (a
# dead hang), so module/src/fatal.c overrides it to sys_reboot() and the board
# recovers on its own (USB re-enumerates) instead of needing a power cycle.
# CONFIG_REBOOT is required by sys_reboot(). (The actual USB crash was an LVGL
# 1bpp rendering bug — see the M6 section of CLAUDE.md — not a stack overflow.)
CONFIG_HW_STACK_PROTECTION=y
CONFIG_REBOOT=y

# Display infra: LVGL + SSD1306 driver, custom status screen rendering the
# 4 profile slots with the active one marked (module/src/status_screen.c).
# WIDGET_BATTERY_STATUS is enabled both to pull LV_USE_LABEL into the build
# and so the custom screen can compose the battery row alongside profiles.
# LVGL pool / fonts / theme / work queue are pinned in the board
# Kconfig.defconfig — see the M4 section of CLAUDE.md if you need to revisit.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y

# Battery reporting (uses zmk,battery -> vbatt voltage divider on AIN2/P0.04)
CONFIG_ZMK_BATTERY_REPORTING=y

# Profile button is wired P1.02 -> diode -> GND. Pressed line settles at
# ~0.7V (one diode drop), which is marginal for nRF52 GPIO interrupts —
# poll the direct kscan instead so we sample reliably regardless.
CONFIG_ZMK_KSCAN_DIRECT_POLLING=y

# Pointing subsystem — required for the AS5600 encoder's scroll modes
# (&enc_dispatch queues &msc when a profile's mode is V/H scroll).
# SMOOTH_SCROLLING enables HID Resolution Multipliers so hosts that support
# them (macOS/Windows/modern Linux) scroll in fractions of a line = high-res.
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
