# ZMK Studio: set CONFIG_ZMK_STUDIO=y and run: brew install protobuf

# Encoder support (GPIO-based EC11)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Display support (für zukünftige Nutzung)
# CONFIG_ZMK_DISPLAY=y
# CONFIG_LVGL=y
# CONFIG_LVGL_USE_LABEL=y
# CONFIG_LVGL_USE_IMG=y

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Battery monitoring
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# BLE settings
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# USB settings
CONFIG_ZMK_USB=y

# Logging (für Debugging - später auskommentieren)
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y